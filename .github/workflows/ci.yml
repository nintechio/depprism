name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Go ${{ matrix.go }} · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        go: ["1.22.x", stable]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build -trimpath -buildvcs=false ./cmd/depprism
      - name: Race detector
        if: matrix.os == 'ubuntu-latest' && matrix.go == 'stable'
        run: go test -race ./...
      - name: Vulnerability analysis
        if: matrix.os == 'ubuntu-latest' && matrix.go == 'stable'
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

  quality:
    name: Repository quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: stable
          cache: false
      - name: Check formatting
        shell: bash
        run: |
          files="$(gofmt -l .)"
          test -z "$files" || { echo "$files"; exit 1; }
      - name: Check module files
        shell: bash
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Run demonstration
        run: go run ./cmd/depprism diff --format json testdata/demo/before/package-lock.json testdata/demo/after/package-lock.json || test $? -eq 1

  container:
    name: Docker Action
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Build Action image
        run: docker build --tag depprism:ci .
      - name: Verify packaged binary and non-root user
        shell: bash
        run: |
          test "$(docker run --rm depprism:ci version)" = "depprism action"
          docker run --rm --entrypoint /usr/bin/id depprism:ci | grep -q 'uid=10001(depprism)'
