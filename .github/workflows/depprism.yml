name: DepPrism

on:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Review dependency evidence
        uses: nintechio/depprism@v1
