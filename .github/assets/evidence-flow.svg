<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="DepPrism trusted dependency evidence flow">
  <title>DepPrism dependency evidence flow</title>
  <defs><linearGradient id="accent" x1="0" y1="0" x2="1200" y2="420"><stop stop-color="#60a5fa"/><stop offset="0.5" stop-color="#8b5cf6"/><stop offset="1" stop-color="#f97316"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1L9 5 0 9Z" fill="#64748b"/></marker></defs>
  <rect width="1200" height="420" rx="16" fill="#060509"/><rect width="1200" height="3" fill="url(#accent)"/>
  <g font-family="'JetBrains Mono',ui-monospace,monospace" font-size="12" letter-spacing="1.5" fill="#64748b"><text x="52" y="50">TRUSTED</text><text x="310" y="50">COMMITTED EVIDENCE</text><text x="604" y="50">NORMALIZE + COMPARE</text><text x="928" y="50">EXPLAIN</text></g>
  <g font-family="'Plus Jakarta Sans',ui-sans-serif,system-ui,sans-serif">
    <g><rect x="46" y="80" width="220" height="112" rx="14" fill="#60a5fa" fill-opacity="0.08" stroke="#60a5fa" stroke-opacity="0.5"/><text x="68" y="118" font-size="18" font-weight="700" fill="#f8fafc">Base commit</text><text x="68" y="148" font-size="14" fill="#9dbbe0">.depprism.json</text><text x="68" y="171" font-size="12" fill="#64748b">policy cannot be weakened by PR</text></g>
    <g><rect x="304" y="80" width="250" height="240" rx="14" fill="#f97316" fill-opacity="0.06" stroke="#f97316" stroke-opacity="0.46"/><text x="326" y="118" font-size="18" font-weight="700" fill="#f8fafc">Both revisions</text><g font-family="'JetBrains Mono',ui-monospace,monospace" font-size="13" fill="#fdba74"><text x="326" y="160">lockfile identity</text><text x="326" y="190">companion manifest</text><text x="326" y="220">source + integrity</text><text x="326" y="250">dependency edges</text><text x="326" y="280">recorded behavior</text></g><text x="326" y="303" font-size="12.5" fill="#8b93a7">Git objects · no installation</text></g>
    <g><rect x="592" y="80" width="268" height="240" rx="14" fill="#8b5cf6" fill-opacity="0.08" stroke="#8b5cf6" stroke-opacity="0.52"/><text x="614" y="118" font-size="18" font-weight="700" fill="#f8fafc">DepPrism core</text><g font-family="'JetBrains Mono',ui-monospace,monospace" font-size="13" fill="#c4b5fd"><text x="614" y="160">normalized graph</text><text x="614" y="190">semantic matching</text><text x="614" y="220">shortest known path</text><text x="614" y="250">evidence findings</text><text x="614" y="280">strict policy</text></g><text x="614" y="303" font-size="12.5" fill="#8b93a7">offline · deterministic · inspectable</text></g>
    <g><rect x="898" y="80" width="254" height="104" rx="14" fill="#34d399" fill-opacity="0.08" stroke="#34d399" stroke-opacity="0.5"/><text x="920" y="116" font-size="18" font-weight="700" fill="#6ee7b7">REVIEW</text><text x="920" y="144" font-size="12.5" fill="#cbd5e1">package · transition · cause</text><text x="920" y="165" font-size="12.5" fill="#cbd5e1">evidence · path · policy</text></g>
    <g><rect x="898" y="216" width="254" height="104" rx="14" fill="#f87171" fill-opacity="0.07" stroke="#f87171" stroke-opacity="0.5"/><text x="920" y="254" font-size="18" font-weight="700" fill="#fca5a5">POLICY FAIL</text><text x="920" y="285" font-size="12.5" fill="#cbd5e1">named rule · explicit reason</text></g>
  </g>
  <g fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"><path d="M266 136H284"/><path d="M554 136H572"/><path d="M860 136H878"/><path d="M860 270H878"/></g>
  <g font-family="'JetBrains Mono',ui-monospace,monospace" font-size="12.5"><rect x="46" y="354" width="1106" height="38" rx="10" fill="#fff" fill-opacity="0.035" stroke="#fff" stroke-opacity="0.1"/><text x="599" y="378" text-anchor="middle" fill="#94a3b8">same committed evidence + same base policy = same review result</text></g>
</svg>
